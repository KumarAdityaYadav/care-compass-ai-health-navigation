version: '3.8'

services:
  carecompass:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carecompass-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - TINYFISH_API_KEY=${TINYFISH_API_KEY:-}
    restart: unless-stopped
